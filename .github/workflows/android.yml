name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "GOOGLE_SERVICES_JSON is empty, using dummy file for CI"
          echo '{"project_info":{"project_number":"0","project_id":"ci-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.solerforge.lumeria"}},"api_key":[{"current_key":"ci-dummy"}]}]}' > app/google-services.json
        else
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug
    - name: Run Tests
      run: ./gradlew test
    - name: Run Lint
      run: ./gradlew lintDebug
    - name: Build Release
      run: ./gradlew assembleRelease
      env:
        SAVE_SIGN_KEY: ${{ secrets.SAVE_SIGN_KEY }}
